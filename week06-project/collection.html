<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warsaw Guitars - Collection</title>
    <!--Icon-->
    <link rel="shortcut icon" href="images/warsaw-guitars-logo.png">
    <!--Description-->
    <meta name="author" content="Brendan Brady">
    <meta name="description" content="Warsaw Guitars' page displaying their guitar collection.">
    <!--CSS-->
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/collection.css">
    <!--JS-->
    <script src="scripts/warsaw-guitars.js" defer></script>
    <script src="scripts/guitar-info.js" defer></script>
    <!--Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="logo-title">
            <img class="logo" src="images/warsaw-guitars-logo.png" alt="warsaw guitars logo" loading="lazy">
            <h1>Warsaw Guitars</h1>
        </div>
        
        <button type="button" id="menu"></button>
        <nav>
            <ul class="navigation">
                <li id="home"><a href="index.html">Home</a></li>
                <li id="collection"><a href="collection.html">Guitars</a></li>
                <li id="contact"><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="choice-bar">
            <div id="choices">
                <img class="choice" id="hellcat" src="images/fender-hellcat.jpg" alt="Fender - Hellcat">
                <img class="choice" id="artcore" src="images/ibanez-artcore.jpg" alt="Ibanez - Artcore">
                <img class="choice" id="majesty" src="images/music-man-majesty.jpg" alt="Music Man - Majesty">
            </div>
            <h3>Choose a Guitar</h3>
        </div>

        <div class="guitar-info"></div>

        <section id="questions">
            <div id="questions-container">
                <h2>Ready to buy?</h2>
                <h2>Have any questions?</h2>

                <button type="button" id="contact-button" onclick="window.location.href='contact.html'">Contact Us!</button>
                
                <p>We'll set you up with exactly what you need.</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="socials">
            <a href="https://www.facebook.com"><img class="social" src="images/facebook.svg" alt="facebook" loading="lazy"></a>
            <a href="https://www.instagram.com"><img class="social" src="images/instagram.svg" alt="instagram" loading="lazy"></a>
            <a href="index.html"><img class="logo" src="images/warsaw-guitars-logo.png" alt="warsaw guitars logo" loading="lazy"></a>
            <a href="https://www.youtube.com"><img class="social" src="images/youtube.svg" alt="youtube" loading="lazy"></a>
            <a href="https://www.tiktok.com"><img class="social" src="images/tiktok.svg" alt="tiktok" loading="lazy"></a>
        </div>
        
        <p>©<span id="currentYear"></span> 🥟 Brendan Brady 🥟 Poland</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
